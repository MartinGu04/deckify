[package]
name = "deckify-media-bridge"
version = "0.1.0"
edition = "2024"
description = "Deckify's Windows media-session helper: sends Play/Pause/Next/Previous to the local Spotify app via GSMTC."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
