<svg xmlns="http://www.w3.org/2000/svg" width="784" height="560" viewBox="0 0 784 560">
	<title>Illustration of a Deckify layout on a 5×3 Stream Deck, built from Deckify's own key images</title>
	<!-- Generated by scripts/export-deck-overview.mjs from com.marting.deckify.sdPlugin/imgs/actions. Not a photo; no Spotify artwork or track data. -->
	<defs><clipPath id="key" clipPathUnits="objectBoundingBox"><rect width="1" height="1" rx="0.14"/></clipPath></defs>
	<text x="40" y="36" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#8B949E">ILLUSTRATION · EXAMPLE 5×3 LAYOUT · FREE KEYS FOR MORE PLAYLISTS</text>
	<g clip-path="url(#key)">
		<svg x="40" y="64" width="112" height="112" viewBox="0 0 144 144">
