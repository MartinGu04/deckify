<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>Deckify Promo Film</title>
		<link rel="icon" href="/brand/deckify-symbol.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/film/film.css" />
	</head>
	<body>
		<div id="viewport">
			<div id="stage">
				<div id="bg" class="layer"></div>
				<div id="world" class="layer"><div id="rig"></div></div>
				<div id="scrim" class="layer"></div>
				<div id="panel"></div>
				<div id="flyers" class="layer"></div>
				<div id="setup-wrap"><iframe id="setup" title="Deckify Setup" tabindex="-1"></iframe></div>
				<svg id="cursor" viewBox="0 0 30 44" aria-hidden="true">
					<!-- Standard arrow pointer. -->
					<path d="M3 2 L3 34 L11 26.5 L16.5 39 L22 36.6 L16.6 24.4 L27 24.4 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round" />
				</svg>
				<div id="click"></div>
				<div id="type" class="layer"></div>
				<div id="steps"></div>
				<div id="marks" class="layer"></div>
				<div id="tagline"></div>
				<div id="support"></div>
				<div id="vignette" class="layer"></div>
				<div id="grain" class="layer"></div>
				<div id="black" class="layer"></div>
			</div>
		</div>
		<div id="controls">
			<button id="play" type="button">Play</button>
			<span id="time">0.00 s</span>
			<input id="scrub" type="range" min="0" max="24" step="0.01" value="0" aria-label="Film time" />
			<a id="format" href="?format=mobile">9:16</a>
		</div>
		<svg width="0" height="0" style="position: absolute" aria-hidden="true">
			<filter id="motion-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="motion-blur-std" stdDeviation="0 0" /></filter>
		</svg>
		<script type="module" src="/film/film.js"></script>
	</body>
</html>
