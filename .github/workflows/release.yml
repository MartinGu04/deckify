name: Release

# Publishes a GitHub Release with the .streamDeckPlugin package when a version tag (v1.2.3) is pushed. See docs/development.md#releases.
#
# Two jobs, so the write token never meets project code: "build" (read-only) builds and verifies the package on Windows, where the
# native Rust media bridge is built and bundled; "publish" (contents: write) runs no project code and only uploads that package.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the release package (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the next step can check that the tag is on main.
          fetch-depth: 0

      - name: Check that the tagged commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to a commit that is not on main. Tag a commit from main."
            exit 1
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check that the tag matches the project version
        run: node scripts/release-check.mjs "$env:TAG"

      # rustup ships with the Windows runner image; native/media-bridge/rust-toolchain.toml pins the Rust version, which rustup installs
      # from the official Rust distribution on first use.
      - name: Show Rust toolchain
        working-directory: native/media-bridge
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install dependencies
        run: npm ci

      - name: Native tests
        run: npm run native:test

      - name: Native format check (rustfmt)
        working-directory: native/media-bridge
        run: cargo fmt --check

      - name: Native lint (clippy)
        working-directory: native/media-bridge
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build and package (release helper bundled and verified in the .streamDeckPlugin)
        run: npm run pack

      - name: Typecheck, lint, build, smoke test, tests and Stream Deck validation (includes the real helper)
        run: npm run check

      - name: Verify the release package (version and Windows media bridge)
        run: node scripts/release-check.mjs "$env:TAG" --package

      - name: Upload the release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: dist/com.marting.deckify.streamDeckPlugin
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit (release notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dist

      # Fails, without changing anything, if a release for this tag already exists.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/com.marting.deckify.streamDeckPlugin \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Deckify $TAG" \
            --notes-file "docs/releases/$TAG.md"
