name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build, validate, smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  windows-native:
    name: Windows media bridge (native build, tests, package)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # rustup ships with the Windows runner image; native/media-bridge/rust-toolchain.toml pins the Rust version, which rustup installs
      # from the official Rust distribution on first use. No other binaries are downloaded.
      - name: Show Rust toolchain
        working-directory: native/media-bridge
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install dependencies
        run: npm ci

      - name: Native tests (protocol, Spotify-only session selection, dispatch)
        run: npm run native:test

      - name: Native lint (rustfmt, clippy)
        working-directory: native/media-bridge
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build and package (release helper bundled and verified in the .streamDeckPlugin)
        run: npm run pack

      - name: TypeScript checks and tests on Windows (includes the real helper against real GSMTC)
        run: npm run check

      - name: Upload plugin package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deckify-streamDeckPlugin
          path: dist/com.marting.deckify.streamDeckPlugin
          if-no-files-found: error
          retention-days: 14
